name: Build Mawaqit APK

# ── CURRENT STRATEGY (Sept 2026) ─────────────────────────────────────────────
# PRIMARY BUILDER (since 2026-09-20): this workflow itself. Every push to main
# automatically builds a fresh APK on GitHub's own Linux machine (SDK already
# present at $ANDROID_HOME); the finished APK lands in the run's "Artifacts"
# section. Codespaces (setup.sh + build.sh) is now only the manual fallback.
# History: push-triggers were disabled when android-actions/setup-android broke
# repo-wide (Google retired the 'tools' package, Sept 2026) — but this workflow
# never used that action; it talks to sdkmanager directly, so auto-builds are
# safe to re-enable. paths-ignore keeps doc-only commits from burning minutes.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'codespaces/**'
  workflow_dispatch:    # manual run also available (Actions tab → Run workflow)

# One build at a time per branch; a newer push cancels the stale run
# (protects the free-tier minutes pool on private repos).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # Step 1 — Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Set up Java 17 (required by Android Gradle Plugin 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Step 3 — Android SDK.
      # We deliberately do NOT use android-actions/setup-android here: as of
      # Sept 2026 its default package set includes the retired 'tools' package
      # (google stopped serving it — issues #537/#538), which fails the job.
      # GitHub's ubuntu runners already ship the SDK at $ANDROID_HOME, so we
      # accept licenses and install exactly what our project needs ourselves.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" > /dev/null
          sdkmanager --list_installed 2>/dev/null | head -20 || true

      # Step 4 — Grant Gradle execute permission
      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      # Step 5 — Cache Gradle dependencies
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 6 — Build the debug APK.
      # tee captures full output; pipefail keeps the step failing on error.
      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_output.log
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

      # Step 6b — If the build failed, surface the real error lines as job
      # annotations (readable via the API without admin log access).
      - name: Report errors as annotations
        if: failure()
        run: |
          echo "=== reporter debug: workspace ==="
          ls -la
          if [ -f build_output.log ]; then
            echo "log exists, $(wc -l < build_output.log) lines"
            grep -E "FAILURE:|What went wrong|Caused by:|error:|^e: |A problem occurred|Could not|Exception is" build_output.log \
              | head -20 > errors.txt || true
            echo "=== matched error lines ==="
            cat errors.txt
            n=0
            while IFS= read -r line; do
              n=$((n+1))
              echo "::error title=gradle-error-$n::${line:0:400}"
            done < errors.txt
            {
              echo "### Build tail (last 80 lines)"
              echo '```'
              tail -n 80 build_output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::build_output.log missing - build failed before tee"
          fi

      # Step 6c — raw build log as an artifact (downloadable from the run page)
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build_output.log
          retention-days: 3
          if-no-files-found: warn

      # Step 7 — Stamp the APK name with the commit, then upload it
      - name: Stamp APK name
        if: success()
        run: |
          SHA=$(git rev-parse --short HEAD || echo dev)
          mv -f app/build/outputs/apk/debug/app-debug.apk \
                app/build/outputs/apk/debug/Mawaqit-1.0.0-$SHA-debug.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mawaqit-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Step 8 — Report build status
      - name: Build Summary
        if: always()
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
