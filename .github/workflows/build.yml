name: Build Mawaqit APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:    # allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # Step 1 — Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Set up Java 17 (required by Android Gradle Plugin 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Step 3 — Android SDK.
      # We deliberately do NOT use android-actions/setup-android here: as of
      # Sept 2026 its default package set includes the retired 'tools' package
      # (google stopped serving it — issues #537/#538), which fails the job.
      # GitHub's ubuntu runners already ship the SDK at $ANDROID_HOME, so we
      # accept licenses and install exactly what our project needs ourselves.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" > /dev/null
          sdkmanager --list_installed 2>/dev/null | head -20 || true

      # Step 4 — Grant Gradle execute permission
      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      # Step 5 — Cache Gradle dependencies
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 6 — Build the debug APK.
      # tee captures full output; pipefail keeps the step failing on error.
      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_output.log
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

      # Step 6b — If the build failed, surface the real error lines as job
      # annotations (readable via the API without admin log access).
      - name: Report errors as annotations
        if: failure()
        run: |
          if [ -f build_output.log ]; then
            grep -nE "(^e: |error:|FAILURE:|What went wrong|Caused by:|A problem occurred|Could not|Exception is)" build_output.log \
              | head -30 \
              | while IFS= read -r line; do echo "::error::${line:0:500}"; done
            tail -n 60 build_output.log > build_tail.txt
            echo "### Build tail (last 60 lines)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat build_tail.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Step 7 — Upload the APK as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mawaqit-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Step 8 — Report build status
      - name: Build Summary
        if: always()
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
